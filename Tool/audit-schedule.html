<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>稽核專案時程</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/frappe-gantt/dist/frappe-gantt.css" rel="stylesheet">
  <style>
    :root { --primary:#2563eb; --sidebar:#0f172a; --background:#f1f5f9; }
    body { background:var(--background); font-family:"Segoe UI","Microsoft JhengHei",sans-serif; }
    .sidebar { position:fixed; inset:0 auto 0 0; width:240px; padding:24px 0; color:#fff; background:var(--sidebar); }
    .logo { padding:0 25px 28px; font-size:26px; font-weight:700; }
    .menu-item { padding:14px 25px; } .menu-item:hover { background:#1e293b; } .active-menu { background:var(--primary); }
    .main { margin-left:240px; padding:25px; } .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .header-title { font-size:28px; font-weight:700; } .header-sub { color:#64748b; }
    .profile,.card-section { background:#fff; box-shadow:0 4px 20px rgba(0,0,0,.08); } .profile { padding:10px 20px; border-radius:50px; }
    .card-section { padding:22px; border-radius:20px; } #gantt { min-height:420px; overflow:auto; }
    .table { vertical-align:middle; } .table thead { background:#eff6ff; }
    .project-summary { padding:14px 16px; border-radius:12px; background:#eff6ff; color:#1e3a8a; }
    .status { padding:4px 10px; border-radius:20px; font-size:.85rem; } .status-not-started { background:#e2e8f0; color:#334155; }
    .status-running { background:#dbeafe; color:#1d4ed8; } .status-done { background:#dcfce7; color:#15803d; }
    @media (max-width:767px) { .sidebar { position:relative; width:100%; height:auto; } .main { margin-left:0; padding:15px; } .header { align-items:flex-start; flex-direction:column; gap:10px; } }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">IA</div>
    <a class="menu-item text-white text-decoration-none d-block" href="index.html">📊 儀表板</a>
    <a class="menu-item active-menu text-white text-decoration-none d-block" href="audit-schedule.html">📋 稽核專案時程</a>
    <div class="menu-item">📈 分析報表</div>
  </aside>
  <main class="main">
    <header class="header">
      <div><div class="header-title">稽核專案時程</div><div class="header-sub">維護各稽核專案的細部工作時程與進度</div></div>
      <div class="profile">👤 Auditor Manager</div>
    </header>
    <section class="card-section mb-4">
      <div class="row align-items-end g-3">
        <div class="col-md-6"><label for="projectSelect" class="form-label fw-semibold">選擇稽核專案</label><select id="projectSelect" class="form-select"></select></div>
        <div class="col-md-6"><div id="projectSummary" class="project-summary">請選擇專案。</div></div>
      </div>
    </section>
    <section class="card-section mb-4">
      <div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">細部時程維護</h5><button id="cancelEditBtn" class="btn btn-sm btn-outline-secondary d-none">取消編輯</button></div>
      <form id="scheduleForm" class="row g-2 align-items-end">
        <div class="col-lg-3 col-md-6"><label for="taskName" class="form-label">工作項目</label><input id="taskName" class="form-control" required placeholder="例如：稽核規劃會議"></div>
        <div class="col-lg-2 col-md-6"><label for="taskOwner" class="form-label">負責人</label><input id="taskOwner" class="form-control" placeholder="姓名"></div>
        <div class="col-lg-2 col-md-6"><label for="taskStart" class="form-label">開始日期</label><input id="taskStart" type="date" class="form-control" required></div>
        <div class="col-lg-2 col-md-6"><label for="taskEnd" class="form-label">結束日期</label><input id="taskEnd" type="date" class="form-control" required></div>
        <div class="col-lg-1 col-md-4"><label for="taskProgress" class="form-label">進度</label><input id="taskProgress" type="number" min="0" max="100" value="0" class="form-control"></div>
        <div class="col-lg-2 col-md-8 d-grid"><button id="saveTaskBtn" type="submit" class="btn btn-primary">新增時程</button></div>
      </form>
    </section>
    <section class="card-section mb-4">
      <h5 class="mb-3">細部時程清單</h5>
      <div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>工作項目</th><th>負責人</th><th>開始日期</th><th>結束日期</th><th>進度</th><th class="text-end">操作</th></tr></thead><tbody id="scheduleTableBody"></tbody></table></div>
    </section>
    <section class="card-section"><h5 class="mb-3">稽核甘特圖</h5><div id="gantt"></div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/frappe-gantt/dist/frappe-gantt.umd.min.js"></script>
  <script>
    const PROJECT_KEY = 'ia_projects_v1', SCHEDULE_KEY = 'ia_project_schedules_v1';
    let projects = [], schedules = [], selectedProjectId = '', editingTaskId = '';
    const byId = id => document.getElementById(id);
    const escapeHtml = value => String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
    function loadData() { try { projects = JSON.parse(localStorage.getItem(PROJECT_KEY)) || []; schedules = JSON.parse(localStorage.getItem(SCHEDULE_KEY)) || []; } catch { projects=[]; schedules=[]; } }
    function saveSchedules() { localStorage.setItem(SCHEDULE_KEY, JSON.stringify(schedules)); }
    function selectedProject() { return projects.find(p => p.id === selectedProjectId); }
    function projectTasks() { return schedules.filter(task => task.projectId === selectedProjectId); }
    function renderProjectOptions() {
      const select = byId('projectSelect');
      if (!projects.length) { select.innerHTML='<option value="">尚無稽核專案，請先至儀表板新增。</option>'; select.disabled=true; return; }
      select.disabled=false; select.innerHTML=projects.map(p => `<option value="${escapeHtml(p.id)}">${escapeHtml(p.id)}－${escapeHtml(p.name)}</option>`).join('');
      selectedProjectId = projects.some(p => p.id === selectedProjectId) ? selectedProjectId : projects[0].id;
      select.value = selectedProjectId;
    }
    function renderSummary() { const p=selectedProject(); byId('projectSummary').textContent = p ? `分類：${p.category || '內部稽核'}　｜　稽核人員：${p.auditor || '未指派'}　｜　專案期間：${p.start || '未設定'} 至 ${p.end || '未設定'}` : '請先至儀表板新增稽核專案。'; }
    function renderTable() { const tasks=projectTasks(); byId('scheduleTableBody').innerHTML=tasks.length ? tasks.map(t=>`<tr><td>${escapeHtml(t.name)}</td><td>${escapeHtml(t.owner)}</td><td>${t.start}</td><td>${t.end}</td><td>${t.progress}%</td><td class="text-end"><button class="btn btn-sm btn-outline-primary me-1" data-action="edit" data-id="${t.id}">編輯</button><button class="btn btn-sm btn-outline-danger" data-action="delete" data-id="${t.id}">刪除</button></td></tr>`).join('') : '<tr><td colspan="6" class="text-center text-secondary py-4">尚無細部時程。</td></tr>'; }
    function renderGantt() { const container=byId('gantt'), tasks=projectTasks(); container.innerHTML=''; if (!tasks.length) { container.innerHTML='<div class="text-secondary py-5 text-center">新增細部時程後，即會在此顯示甘特圖。</div>'; return; } new Gantt('#gantt',tasks.map(t=>({id:t.id,name:t.name,start:t.start,end:t.end,progress:t.progress})),{view_mode:'Month'}); }
    function render() { renderSummary(); renderTable(); renderGantt(); }
    function resetForm() { editingTaskId=''; byId('scheduleForm').reset(); byId('taskProgress').value=0; byId('saveTaskBtn').textContent='新增時程'; byId('cancelEditBtn').classList.add('d-none'); }
    function editTask(id) { const task=schedules.find(t=>t.id===id); if (!task) return; editingTaskId=id; byId('taskName').value=task.name; byId('taskOwner').value=task.owner||''; byId('taskStart').value=task.start; byId('taskEnd').value=task.end; byId('taskProgress').value=task.progress; byId('saveTaskBtn').textContent='儲存修改'; byId('cancelEditBtn').classList.remove('d-none'); byId('taskName').focus(); }
    function saveTask(event) { event.preventDefault(); if (!selectedProjectId) return; const start=byId('taskStart').value,end=byId('taskEnd').value; if (end < start) { alert('結束日期不可早於開始日期。'); return; } const task={id:editingTaskId || `S${Date.now()}`,projectId:selectedProjectId,name:byId('taskName').value.trim(),owner:byId('taskOwner').value.trim(),start,end,progress:Math.min(100,Math.max(0,Number(byId('taskProgress').value)))}; if (editingTaskId) Object.assign(schedules.find(t=>t.id===editingTaskId),task); else schedules.push(task); saveSchedules(); resetForm(); render(); }
    document.addEventListener('DOMContentLoaded',()=>{ loadData(); renderProjectOptions(); render(); byId('projectSelect').addEventListener('change',e=>{selectedProjectId=e.target.value; resetForm(); render();}); byId('scheduleForm').addEventListener('submit',saveTask); byId('cancelEditBtn').addEventListener('click',resetForm); byId('scheduleTableBody').addEventListener('click',e=>{const button=e.target.closest('button[data-action]'); if(!button)return; const id=button.dataset.id; if(button.dataset.action==='edit') editTask(id); else if(confirm('確定刪除此細部時程？')) { schedules=schedules.filter(t=>t.id!==id); saveSchedules(); resetForm(); render(); }}); });
  </script>
</body>
</html>
