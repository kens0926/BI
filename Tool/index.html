<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>內部稽核儀表板</title>
  <link href="vendor/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/frappe-gantt.css" rel="stylesheet">
  <style>
    :root { --primary:#2563eb; --sidebar:#0f172a; --background:#f1f5f9; }
    body { background:var(--background); font-family:"Segoe UI", "Microsoft JhengHei", sans-serif; }
    .sidebar { position:fixed; inset:0 auto 0 0; width:240px; padding:24px 0; color:#fff; background:var(--sidebar); transition:width 0.3s ease, margin-left 0.3s ease; z-index:1000; }
    .sidebar.collapsed { width:70px; padding:24px 0; }
    .logo { padding:0 25px 28px; font-weight:700; font-size:26px; white-space:nowrap; overflow:hidden; }
    .sidebar.collapsed .logo { font-size:20px; padding:0 15px 28px; }
    .sidebar.collapsed .menu-text { display:none; }
    .menu-item { padding:14px 25px; display:flex; align-items:center; gap:10px; cursor:pointer; transition:background 0.2s; }
    .sidebar.collapsed .menu-item { padding:14px 12px; justify-content:center; }
    .menu-item:hover { background:#1e293b; }
    .active-menu { background:var(--primary); }
    .menu-text { white-space:nowrap; }
    .collapse-btn { position:absolute; top:20px; right:10px; background:none; border:none; color:#fff; font-size:18px; cursor:pointer; padding:5px; transition:transform 0.3s; }
    .collapse-btn:hover { transform:scale(1.2); }
    .main { margin-left:240px; padding:25px; transition:margin-left 0.3s ease; }
    .main.expanded { margin-left:70px; }
    .main.fullscreen-gantt { margin-left:0; padding:0; }
    .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .header-title { font-size:28px; font-weight:700; }
    .header-sub { color:#64748b; }
    .profile, .kpi-card, .card-section, .chart-card { background:#fff; box-shadow:0 4px 20px rgba(0,0,0,.08); }
    .profile { padding:10px 20px; border-radius:50px; }
    .kpi-row { display:flex; gap:16px; overflow-x:auto; padding-bottom:8px; }
    .kpi-card { min-width:180px; flex:1 0 200px; display:flex; align-items:center; gap:12px; padding:14px; border-radius:12px; }
    .kpi-icon { display:grid; place-items:center; width:52px; height:52px; border-radius:50%; font-size:22px; }
    .bg-primary-soft { background:#dbeafe; } .bg-success-soft { background:#dcfce7; }
    .bg-warning-soft { background:#fef3c7; } .bg-danger-soft { background:#fee2e2; }
    .kpi h3 { margin:0; font-size:22px; font-weight:700; } .kpi small { color:#64748b; }
    .card-section, .chart-card { border-radius:20px; padding:20px; }
    .gantt-section { position:relative; }
    .gantt-controls { position:absolute; top:0; right:0; z-index:10; display:flex; gap:8px; }
    .table { vertical-align:middle; } .table thead { background:#eff6ff; }
    .status-running, .status-done, .status-overdue { display:inline-block; padding:5px 12px; border-radius:20px; }
    .status-running { color:#1d4ed8; background:#dbeafe; } .status-done { color:#15803d; background:#dcfce7; }
    .status-overdue { color:#dc2626; background:#fee2e2; }
    .progress { height:10px; border-radius:20px; } .progress-bar { background:linear-gradient(90deg,#2563eb,#60a5fa); }
    .analytics-row > [class*="col-"] { display:flex; }
    .analytics-card { width:100%; height:390px; display:flex; flex-direction:column; position:relative; }
    .chart-wrapper, #gantt { flex:1; min-height:0; overflow:auto; }
    .chart-wrapper canvas { width:100% !important; height:100% !important; display:block; }
    #ganttFullscreen { position:fixed; inset:0; background:#fff; z-index:2000; display:none; flex-direction:column; }
    #ganttFullscreen.active { display:flex; }
    #ganttFullscreenHeader { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; background:#f8f9fa; border-bottom:1px solid #dee2e6; }
    #ganttFullscreenContent { flex:1; overflow:auto; padding:20px; }
    .gantt-fullscreen-btn, .gantt-close-btn { background:none; border:1px solid #ccc; color:#666; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; transition:all 0.2s; }
    .gantt-fullscreen-btn:hover { background:#2563eb; color:#fff; border-color:#2563eb; }
    .gantt-close-btn:hover { background:#dc2626; color:#fff; border-color:#dc2626; }
    #csvFileInput { display:none; }
    .import-result { padding:12px 16px; border-radius:8px; margin-top:12px; font-size:14px; }
    .import-success { background:#dcfce7; color:#166534; border:1px solid #bbf7d0; }
    .import-error { background:#fee2e2; color:#991b1b; border:1px solid #fecaca; }
    .import-warning { background:#fef3c7; color:#92400e; border:1px solid #fde68a; }
    @media (max-width:767px) { .sidebar { position:relative; width:100%; height:auto; transition:none; } .sidebar.collapsed { width:100%; } .collapse-btn { display:none; } .main { margin-left:0; padding:15px; transition:none; } .main.expanded { margin-left:0; } .main.fullscreen-gantt { padding:0; } .header { align-items:flex-start; gap:12px; flex-direction:column; } }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <button class="collapse-btn" id="collapseBtn" title="最小化/展開">◀</button>
    <div class="logo">IA</div>
    <a class="menu-item active-menu text-white text-decoration-none d-block" href="index.html"><span>📊</span><span class="menu-text">儀表板</span></a>
    <a class="menu-item text-white text-decoration-none d-block" href="audit-schedule.html"><span>📋</span><span class="menu-text">稽核專案時程</span></a>
    <a class="menu-item text-white text-decoration-none d-block" href="nas-url-dashboard.html"><span>🔗</span><span class="menu-text">NAS／URL 連結看板</span></a>
  </aside>
  <main class="main" id="main">
    <header class="header">
      <div><div class="header-title">Internal Audit Dashboard</div><div class="header-sub">內部稽核專案管理與進度追蹤</div></div>
      <div class="profile">👤 Auditor Manager</div>
    </header>
    <section class="mb-4"><div class="kpi-row">
      <div class="kpi-card"><div class="kpi-icon bg-primary-soft">📁</div><div class="kpi"><h3 id="totalProjects">0</h3><small>全部專案</small></div></div>
      <div class="kpi-card"><div class="kpi-icon bg-warning-soft">⏳</div><div class="kpi"><h3 id="running">0</h3><small>進行中</small></div></div>
      <div class="kpi-card"><div class="kpi-icon bg-success-soft">✓</div><div class="kpi"><h3 id="completed">0</h3><small>已完成</small></div></div>
      <div class="kpi-card"><div class="kpi-icon bg-danger-soft">!</div><div class="kpi"><h3 id="overdue">0</h3><small>逾期</small></div></div>
    </div></section>
    <section class="card-section mb-4">
      <h5 class="mb-3">新增稽核專案</h5>
      <div class="row g-2 align-items-center">
        <div class="col-md-2 col-6"><input id="projectNo" class="form-control" placeholder="專案編號"></div>
        <div class="col-md-3 col-6"><input id="projectName" class="form-control" placeholder="專案名稱"></div>
        <div class="col-md-2 col-6"><select id="category" class="form-select" aria-label="分類"><option value="外部稽核">外部稽核</option><option value="內部稽核" selected>內部稽核</option><option value="臨時稽核">臨時稽核</option><option value="申訴檢舉">申訴檢舉</option></select></div>
        <div class="col-md-2 col-6"><input id="auditor" class="form-control" placeholder="稽核人員"></div>
        <div class="col-md-2 col-6"><input id="startDate" type="date" class="form-control" aria-label="開始日期"></div>
        <div class="col-md-2 col-6"><input id="endDate" type="date" class="form-control" aria-label="結束日期"></div>
        <div class="col-md-1 col-6 d-grid"><button id="addBtn" class="btn btn-primary">新增</button></div>
        <div class="col-md-1 col-6 d-grid"><button id="exportCsv" class="btn btn-outline-secondary">匯出 CSV</button></div>
        <div class="col-md-1 col-6 d-grid"><button id="importBtn" class="btn btn-outline-info">匯入 CSV</button></div>
      </div>
      <div id="importResult"></div>
      <input type="file" id="csvFileInput" accept=".csv" />
    </section>
    <section class="row mb-4 analytics-row">
      <div class="col-md-4 mb-3"><div class="chart-card analytics-card"><h5 class="mb-3">專案狀態分析</h5><div class="chart-wrapper"><canvas id="statusChart"></canvas></div></div></div>
      <div class="col-md-8 mb-3"><div class="chart-card analytics-card gantt-section"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">年度稽核甘特圖</h5><div class="gantt-controls"><button id="ganttFullscreenBtn" class="gantt-fullscreen-btn" title="放大至整頁">🔍 放大</button></div></div><div id="gantt"></div></div></div>
    </section>
    <section class="card-section">
      <h5 class="mb-3">稽核專案清單</h5>
      <div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>專案編號</th><th>專案名稱</th><th>分類</th><th>稽核人員</th><th>進度</th><th>狀態</th><th>結束日期</th><th>操作</th></tr></thead><tbody id="projectTableBody"></tbody></table></div>
    </section>
  </main>

  <!-- 全屏甘特圖模態 -->
  <div id="ganttFullscreen">
    <div id="ganttFullscreenHeader">
      <div>
        <h4 class="mb-0">年度稽核甘特圖 - 全屏模式</h4>
        <small class="text-muted">共 <span id="ganttProjectCount">0</span> 個專案</small>
      </div>
      <button id="ganttCloseBtn" class="gantt-close-btn" title="關閉全屏">✕ 關閉</button>
    </div>
    <div id="ganttFullscreenContent">
      <div id="ganttFullscreenChart"></div>
    </div>
  </div>

  <div class="modal fade" id="editProjectModal" tabindex="-1" aria-labelledby="editProjectModalLabel" aria-hidden="true"><div class="modal-dialog"><form class="modal-content" id="editProjectForm">
    <div class="modal-header"><h5 class="modal-title" id="editProjectModalLabel">編輯稽核專案</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button></div>
    <div class="modal-body"><input type="hidden" id="editOriginalId">
      <div class="mb-3"><label for="editProjectNo" class="form-label">專案編號</label><input id="editProjectNo" class="form-control" required></div>
      <div class="mb-3"><label for="editProjectName" class="form-label">專案名稱</label><input id="editProjectName" class="form-control" required></div>
      <div class="mb-3"><label for="editCategory" class="form-label">分類</label><select id="editCategory" class="form-select"><option value="外部稽核">外部稽核</option><option value="內部稽核">內部稽核</option><option value="臨時稽核">臨時稽核</option><option value="申訴檢舉">申訴檢舉</option></select></div>
      <div class="mb-3"><label for="editAuditor" class="form-label">稽核人員</label><input id="editAuditor" class="form-control"></div>
      <div class="row"><div class="col-6 mb-3"><label for="editStartDate" class="form-label">開始日期</label><input id="editStartDate" type="date" class="form-control"></div><div class="col-6 mb-3"><label for="editEndDate" class="form-label">結束日期</label><input id="editEndDate" type="date" class="form-control"></div></div>
      <div><label for="editProgress" class="form-label">進度（0–100%）</label><input id="editProgress" type="number" min="0" max="100" class="form-control" required></div>
    </div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button><button type="submit" class="btn btn-primary">儲存修改</button></div>
  </form></div></div>
  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/frappe-gantt.umd.min.js"></script>
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script>
    const STORAGE_KEY = 'ia_projects_v1';
    const SCHEDULE_KEY = 'ia_project_schedules_v1';
    const SIDEBAR_STATE_KEY = 'ia_sidebar_collapsed';
    /*
    const DEFAULT_PROJECTS = [
      { id:'IA001', name:'採購流程稽核', category:'內部稽核', auditor:'David', start:'2026-08-01', end:'2026-08-31', progress:70 },
      { id:'IA002', name:'ERP 系統稽核', category:'外部稽核', auditor:'Amy', start:'2026-07-01', end:'2026-07-25', progress:100 }
    ];
    */
    let projects = [], chartInstance, ganttInstance, ganttFullscreenInstance;
    const byId = id => document.getElementById(id);
    const escapeHtml = value => String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);
    const isOverdue = project => project.progress < 100 && project.end && new Date(project.end + 'T23:59:59') < new Date();
    const formatDate = value => { const date = value instanceof Date ? value : new Date(value); return Number.isNaN(date.getTime()) ? '' : `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; };
    const isValidDate = value => /^\d{4}-\d{2}-\d{2}$/.test(value) && formatDate(value)===value;
    
    function toggleSidebar() {
      const sidebar = byId('sidebar');
      const main = byId('main');
      const collapseBtn = byId('collapseBtn');
      const isCollapsed = sidebar.classList.toggle('collapsed');
      main.classList.toggle('expanded');
      localStorage.setItem(SIDEBAR_STATE_KEY, isCollapsed ? 'true' : 'false');
      collapseBtn.textContent = isCollapsed ? '▶' : '◀';
    }
    
    function restoreSidebarState() {
      const isCollapsed = localStorage.getItem(SIDEBAR_STATE_KEY) === 'true';
      if (isCollapsed) {
        byId('sidebar').classList.add('collapsed');
        byId('main').classList.add('expanded');
        byId('collapseBtn').textContent = '▶';
      }
    }
    
    function toggleGanttFullscreen() {
      const fullscreenDiv = byId('ganttFullscreen');
      fullscreenDiv.classList.toggle('active');
      if (fullscreenDiv.classList.contains('active')) {
        byId('main').classList.add('fullscreen-gantt');
        renderGanttFullscreen();
      } else {
        byId('main').classList.remove('fullscreen-gantt');
        if (ganttFullscreenInstance) ganttFullscreenInstance = null;
      }
    }
    
    function showImportResult(message, type) {
      const resultDiv = byId('importResult');
      resultDiv.innerHTML = `<div class="import-result import-${type}">${escapeHtml(message)}</div>`;
      setTimeout(() => { resultDiv.innerHTML = ''; }, 5000);
    }
    
    function parseCsvRows(text) { const rows=[], row=[]; let cell='', quoted=false; for(let i=0;i<text.length;i++){ const char=text[i], next=text[i+1]; if(char==='"'&&quoted&&next==='"'){cell+='"';i++;} else if(char==='"'){quoted=!quoted;} else if(char===','&&!quoted){row.push(cell.trim());cell='';} else if((char==='\n'||char==='\r')&&!quoted){if(char==='\r'&&next==='\n')i++;row.push(cell.trim());if(row.some(value=>value!==''))rows.push(row.splice(0));cell='';} else {cell+=char;} } row.push(cell.trim());if(row.some(value=>value!==''))rows.push(row);return rows; }
    function parseCSV(text) {
      const lines = parseCsvRows(text.replace(/^\uFEFF/,''));
      if (lines.length < 2) return { data: [], errors: ['CSV檔案格式錯誤：至少需要標題列和資料列'] };
      
      const headers = lines[0];
      const requiredHeaders = ['專案編號', '專案名稱', '分類', '稽核人員', '開始日期', '結束日期', '進度'];
      const missingHeaders = requiredHeaders.filter(h => !headers.includes(h));
      if (missingHeaders.length > 0) {
        return { data: [], errors: [`缺少必要欄位：${missingHeaders.join(', ')}`] };
      }
      
      const data = [], errors = [];
      for (let i = 1; i < lines.length; i++) {
        const values = lines[i];
        if (values.length < requiredHeaders.length) continue;
        
        const row = {};
        headers.forEach((h, idx) => { row[h] = values[idx] || ''; });
        
        if (!row['專案編號']) { errors.push(`第 ${i+1} 列：缺少專案編號`); continue; }
        if (!row['專案名稱']) { errors.push(`第 ${i+1} 列：缺少專案名稱`); continue; }
        
        const progress = Number(row['進度']);
        if (!Number.isFinite(progress) || progress < 0 || progress > 100) { errors.push(`第 ${i+1} 列：進度必須為 0-100 的數字`); continue; }
        if ((row['開始日期'] && !isValidDate(row['開始日期'])) || (row['結束日期'] && !isValidDate(row['結束日期']))) { errors.push(`第 ${i+1} 列：日期格式必須為 YYYY-MM-DD`); continue; }
        if (row['開始日期'] && row['結束日期'] && row['結束日期'] < row['開始日期']) { errors.push(`第 ${i+1} 列：結束日期不可早於開始日期`); continue; }
        
        data.push({
          id: row['專案編號'],
          name: row['專案名稱'],
          category: row['分類'] || '內部稽核',
          auditor: row['稽核人員'] || '',
          start: row['開始日期'] || '',
          end: row['結束日期'] || '',
          progress: progress
        });
      }
      
      return { data, errors };
    }
    
    function importCSV(file) {
      const reader = new FileReader();
      reader.onload = e => {
        const text = e.target.result;
        const { data, errors } = parseCSV(text);
        
        if (errors.length > 0) {
          showImportResult(`❌ 匯入失敗\n${errors.join('\n')}`, 'error');
          return;
        }
        
        if (data.length === 0) {
          showImportResult('⚠️ 沒有有效的資料可匯入', 'warning');
          return;
        }
        
        let added = 0, skipped = 0;
        data.forEach(newProject => {
          if (projects.some(p => p.id === newProject.id)) {
            skipped++;
          } else {
            projects.push(newProject);
            added++;
          }
        });
        
        saveProjects();
        renderProjects();
        
        let message = `✅ 匯入成功！新增 ${added} 個專案`;
        if (skipped > 0) message += `，跳過 ${skipped} 個重複專案`;
        showImportResult(message, 'success');
      };
      reader.readAsText(file);
    }
    
    function loadProjects() { try { projects = JSON.parse(localStorage.getItem(STORAGE_KEY)) || DEFAULT_PROJECTS; } catch { projects = DEFAULT_PROJECTS; } saveProjects(); }
    function saveProjects() { localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); window.__saveProjectsFile?.(projects); }
    function statusBadge(project) { if (project.progress >= 100) return '<span class="status-done">已完成</span>'; if (isOverdue(project)) return '<span class="status-overdue">逾期</span>'; return '<span class="status-running">進行中</span>'; }
    function renderProjects() {
      byId('projectTableBody').innerHTML = projects.map(p => `<tr><td>${escapeHtml(p.id)}</td><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.category || '內部稽核')}</td><td>${escapeHtml(p.auditor || '未指派')}</td><td><div class="progress"><div class="progress-bar" style="width:${p.progress}%"></div></div></td><td>${statusBadge(p)}</td><td>${escapeHtml(p.end || '-')}</td><td><button class="btn btn-sm btn-outline-primary" onclick="openEditProject('${escapeHtml(p.id)}')">編輯</button></td></tr>`).join('');
      updateKPIs(); updateChart(); updateGantt();
    }
    function updateKPIs() { const completed=projects.filter(p=>p.progress>=100).length, overdue=projects.filter(isOverdue).length; byId('totalProjects').textContent=projects.length; byId('completed').textContent=completed; byId('running').textContent=projects.length-completed-overdue; byId('overdue').textContent=overdue; }
    function updateChart() { const completed=projects.filter(p=>p.progress>=100).length, overdue=projects.filter(isOverdue).length; chartInstance.data.datasets[0].data=[completed,projects.length-completed-overdue,overdue]; chartInstance.update(); }
    function saveGanttDates(task, start, end) { const project=projects.find(p=>p.id===task.id); if (!project) return; project.start=formatDate(start)||project.start; project.end=formatDate(end)||project.end; saveProjects(); renderProjects(); }
    function saveGanttProgress(task, progress) { const project=projects.find(p=>p.id===task.id); if (!project) return; project.progress=Math.max(0,Math.min(100,Number(progress)||0)); saveProjects(); renderProjects(); }
    function ganttTask(project, today) { const colors={內部稽核:['#60a5fa','#2563eb'],外部稽核:['#fbbf24','#d97706'],臨時稽核:['#86efac','#16a34a'],申訴檢舉:['#fda4af','#e11d48']}[project.category] || ['#60a5fa','#2563eb']; return {id:project.id,name:project.name,start:project.start||project.end||today,end:project.end||project.start||today,progress:project.progress,color:colors[0],color_progress:colors[1]}; }
    function updateGantt() { const today=new Date().toISOString().slice(0,10), tasks=projects.map(p=>ganttTask(p,today)); if (ganttInstance) ganttInstance.refresh(tasks); else ganttInstance=new Gantt('#gantt',tasks,{on_click:task=>{},on_after_date_change:saveGanttDates,on_progress_change:saveGanttProgress,view_mode:'Month',bar_corner_radius:4}); }
    function renderGanttFullscreen() { const container=byId('ganttFullscreenChart'), today=new Date().toISOString().slice(0,10), tasks=projects.map(p=>ganttTask(p,today)); byId('ganttProjectCount').textContent=projects.length; container.innerHTML=''; if (!tasks.length) { container.innerHTML='<div class="text-secondary py-5 text-center">尚無專案</div>'; return; } ganttFullscreenInstance=new Gantt(container,tasks,{on_click:task=>{},on_after_date_change:saveGanttDates,on_progress_change:saveGanttProgress,view_mode:'Month',bar_corner_radius:4}); }
    function clearAddForm() { ['projectNo','projectName','auditor','startDate','endDate'].forEach(id => byId(id).value=''); byId('category').value='內部稽核'; }
    function addProject() { const id=byId('projectNo').value.trim() || `P${Date.now()}`, name=byId('projectName').value.trim(), start=byId('startDate').value, end=byId('endDate').value; if (!name) { alert('請輸入專案名稱。'); return; } if (end && start && end<start) { alert('結束日期不可早於開始日期。'); return; } if (projects.some(p=>p.id===id)) { alert('專案編號已存在。'); return; } projects.push({id,name,category:byId('category').value,auditor:byId('auditor').value,start,end,progress:0}); saveProjects(); renderProjects(); clearAddForm(); }
    function openEditProject(id) { const p=projects.find(item=>item.id===id); if (!p) return; byId('editOriginalId').value=p.id; byId('editProjectNo').value=p.id; byId('editProjectName').value=p.name; byId('editCategory').value=p.category||'內部稽核'; byId('editAuditor').value=p.auditor||''; byId('editStartDate').value=p.start||''; byId('editEndDate').value=p.end||''; byId('editProgress').value=p.progress||0; new bootstrap.Modal(byId('editProjectModal')).show(); }
    function migrateScheduleProjectId(oldId, newId) { if (oldId===newId) return; try { const schedules=JSON.parse(localStorage.getItem(SCHEDULE_KEY)) || []; const updated=schedules.map(task=>task.projectId===oldId ? {...task,projectId:newId} : task); if (updated.some((task,index)=>task!==schedules[index])) localStorage.setItem(SCHEDULE_KEY,JSON.stringify(updated)); window.__migrateScheduleProjectIdFile?.(oldId,newId,updated); } catch { /* Preserve existing schedules if stored data is invalid. */ } }
    function saveEditedProject() { const oldId=byId('editOriginalId').value, id=byId('editProjectNo').value.trim(), name=byId('editProjectName').value.trim(), start=byId('editStartDate').value, end=byId('editEndDate').value, progress=Math.max(0,Math.min(100,Number(byId('editProgress').value)||0)); if (!name) { alert('請輸入專案名稱。'); return; } if (end && start && end<start) { alert('結束日期不可早於開始日期。'); return; } const p=projects.find(item=>item.id===oldId); if (!p) return; if (id!==oldId && projects.some(item=>item.id===id)) { alert('專案編號已存在。'); return; } p.id=id; p.name=name; p.category=byId('editCategory').value; p.auditor=byId('editAuditor').value; p.start=start; p.end=end; p.progress=progress; migrateScheduleProjectId(oldId,id); saveProjects(); renderProjects(); bootstrap.Modal.getInstance(byId('editProjectModal')).hide(); }
    function exportCsv() { const rows=[['專案編號','專案名稱','分類','稽核人員','開始日期','結束日期','進度'],...projects.map(p=>[p.id,p.name,p.category||'內部稽核',p.auditor||'',p.start||'',p.end||'',p.progress])], csv=rows.map(r=>r.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n'), blob=new Blob([csv],{type:'text/csv'}), url=URL.createObjectURL(blob), link=document.createElement('a'); link.href=url; link.download='audit_projects.csv'; link.click(); URL.revokeObjectURL(url); }
    document.addEventListener('DOMContentLoaded', () => { loadProjects(); restoreSidebarState(); byId('collapseBtn').addEventListener('click', toggleSidebar); byId('ganttFullscreenBtn').addEventListener('click', toggleGanttFullscreen); byId('ganttCloseBtn').addEventListener('click', toggleGanttFullscreen); document.addEventListener('keydown', e => { if (e.key === 'Escape' && byId('ganttFullscreen').classList.contains('active')) toggleGanttFullscreen(); }); byId('importBtn').addEventListener('click', () => byId('csvFileInput').click()); byId('csvFileInput').addEventListener('change', e => { if (e.target.files.length > 0) importCSV(e.target.files[0]); e.target.value = ''; }); chartInstance=new Chart(byId('statusChart'),{type:'doughnut',data:{labels:['Completed','In progress','Overdue'],datasets:[{data:[0,0,0],backgroundColor:['#dcfce7','#dbeafe','#fee2e2'],borderColor:'#fff',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom'}}}}); renderProjects(); byId('addBtn').addEventListener('click',addProject); byId('exportCsv').addEventListener('click',exportCsv); byId('editProjectForm').addEventListener('submit',e=>{e.preventDefault(); saveEditedProject();}); });
  </script>
  <script>
    (() => {
      const FILE_NAME = 'tool-data.json', DB_NAME = 'tool-file-storage', STORE_NAME = 'handles';
      let directoryHandle, fileHandle, writeQueue = Promise.resolve();
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'btn btn-sm btn-outline-secondary ms-2';
      const setStatus = enabled => { button.textContent = enabled ? '資料檔：已連結' : '選擇資料夾儲存資料'; };
      const openDb = () => new Promise((resolve, reject) => { const request=indexedDB.open(DB_NAME,1); request.onupgradeneeded=()=>request.result.createObjectStore(STORE_NAME); request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error); });
      const getSavedHandle = async () => { const db=await openDb(); return new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME);const request=tx.objectStore(STORE_NAME).get('directory');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);}); };
      const saveHandle = async handle => { const db=await openDb(); return new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,'readwrite');tx.objectStore(STORE_NAME).put(handle,'directory');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);}); };
      const readFile = async () => { try { const text=await (await fileHandle.getFile()).text(); return text.trim() ? JSON.parse(text) : null; } catch { return null; } };
      const applyData = stored => {
        if (!stored || !Array.isArray(stored.projects)) return false;
        projects=stored.projects;
        localStorage.setItem(STORAGE_KEY,JSON.stringify(projects));
        if (Array.isArray(stored.schedules)) localStorage.setItem(SCHEDULE_KEY,JSON.stringify(stored.schedules));
        renderProjects(); return true;
      };
      const snapshot = () => ({ projects, schedules: JSON.parse(localStorage.getItem(SCHEDULE_KEY) || '[]') });
      const writeData = partial => {
        if (!fileHandle) return;
        writeQueue=writeQueue.then(async()=>{ const current=(await readFile()) || {}; const data={version:1,...current,...partial}; const writable=await fileHandle.createWritable(); await writable.write(JSON.stringify(data,null,2)); await writable.close(); }).catch(error=>console.error('無法寫入資料檔：',error)); return writeQueue;
      };
      window.__saveProjectsFile = savedProjects => writeData({projects:savedProjects});
      window.__migrateScheduleProjectIdFile = (oldId,newId,schedules) => writeData({projects,schedules});
      const connect = async () => {
        if (!window.showDirectoryPicker) return alert('此瀏覽器不支援 File System Access API，請使用最新版 Chrome 或 Edge。');
        try { directoryHandle=await window.showDirectoryPicker({mode:'readwrite'}); fileHandle=await directoryHandle.getFileHandle(FILE_NAME,{create:true}); await saveHandle(directoryHandle); const stored=await readFile(); if (!applyData(stored)) await writeData(snapshot()); setStatus(true); } catch (error) { if(error.name!=='AbortError') alert('無法連結資料夾：'+error.message); }
      };
      button.onclick=connect;
      document.addEventListener('DOMContentLoaded',async()=>{ const profile=document.querySelector('.profile'); if(profile) profile.before(button); else (document.querySelector('header') || document.body).append(button); setStatus(false); try { const handle=await getSavedHandle(); if(handle && await handle.queryPermission({mode:'readwrite'})==='granted') { directoryHandle=handle; fileHandle=await directoryHandle.getFileHandle(FILE_NAME,{create:true}); if(applyData(await readFile())) setStatus(true); } } catch {} });
    })();
  </script>
